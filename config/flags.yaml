apps:
  flutter:
    flags:
      - name: dark_mode
        type: bool
        default: false
      - name: maintenance_mode
        type: bool
        default: false
      - name: feedback_enabled
        type: bool
        default: true
      - name: force_update_enabled
        type: bool
        default: false
      - name: minimum_app_version
        type: string
        default: "1.0.0"
