# ===== FLUTTER APP - DEVELOPMENT =====
dark_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

maintenance_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

feedback_enabled:
  variations:
    enabled: true
    disabled: false
  targeting:
    - query: targetingKey eq "14117d52-7e6d-4f48-95ed-ce024103d6eb"
      variation: disabled
  defaultRule:
    variation: enabled

force_update_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

minimum_app_version:
  variations:
    version: "1.0.0"
  defaultRule:
    variation: version

