# ===== FLUTTER APP - PRODUCTION =====

front-dark-mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

maintenance_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

maintenance_title:
  variations:
    title: "Estamos em manutenção"
  defaultRule:
    variation: title

maintenance_message:
  variations:
    default: "Sistema em manutenção. Voltaremos em breve."
    urgent: "Manutenção de emergência em andamento"
    planned: "Manutenção programada. Previsão: 2h"
  defaultRule:
    variation: default

feedback_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

force_update_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

minimum_app_version:
  variations:
    version: "1.0.0"
  defaultRule:
    variation: version

update_title:
  variations:
    title: "Atualização Necessária"
  defaultRule:
    variation: title

update_message:
  variations:
    default: "Por favor, atualize o aplicativo para continuar"
  defaultRule:
    variation: default

new_dashboard:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

