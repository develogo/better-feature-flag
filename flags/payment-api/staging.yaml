# ===== PAYMENT API - STAGING =====

payment-use-stripe:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

payment-use-paypal:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

max-transaction-amount:
  variations:
    low: 100.00
    medium: 1000.00
    high: 10000.00
  defaultRule:
    variation: medium

enable-refunds:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

