# ===== SHARED FLAGS - STAGING =====
# Flags compartilhadas entre todas as aplicações

maintenance-mode:
  variations:
    active: true
    inactive: false
  defaultRule:
    variation: inactive

redis-cache-enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

log-level:
  variations:
    debug: "debug"
    info: "info"
    warn: "warn"
    error: "error"
  defaultRule:
    variation: info

rate-limit-enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

