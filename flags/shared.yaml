# ===== SHARED FLAGS =====
# Flags compartilhadas entre todas as aplicações

maintenance_mode:
  variations:
    active: true
    inactive: false
  defaultRule:
    variation: inactive

redis_cache_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

log_level:
  variations:
    debug: "debug"
    info: "info"
    warn: "warn"
    error: "error"
  defaultRule:
    variation: warn

rate_limit_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

