# ===== USER API - DEVELOPMENT =====

registration-enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

email-verification-required:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

password-min-length:
  variations:
    short: 6
    medium: 8
    strong: 12
  defaultRule:
    variation: short

new-auth-method:
  variations:
    jwt: "jwt-auth"
    oauth: "oauth-auth"
    legacy: "legacy-auth"
  targeting:
    - query: environment eq "development"
      variation: jwt
  defaultRule:
    variation: legacy

