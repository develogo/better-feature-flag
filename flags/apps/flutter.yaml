# ===== FLUTTER APP =====
dark_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

maintenance_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

feedback_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

force_update_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

minimum_app_version:
  variations:
    version: "1.0.1"
  defaultRule:
    variation: version

