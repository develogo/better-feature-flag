services:
  go-feature-flag:
    image: gofeatureflag/go-feature-flag:latest
    ports:
      - "1031:1031"
    volumes:
      - ./flags:/goff/flags
      - ./goff-proxy-dev.yaml:/goff/goff-proxy.yaml
    restart: unless-stopped
    networks:
      - bettercity_local

networks:
  bettercity_local:
    external: true
    name: bettercity_local